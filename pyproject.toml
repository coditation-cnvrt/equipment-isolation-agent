[project]
name = "equipment-isolation"
version = "0.1.0"
description = "Deterministic local runner for equipment isolation using graph traversal and Plant360 APIs"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16",
    "fastapi[standard]>=0.115",
    "google-genai>=2.10.0",
    "gremlinpython>=3.6.2",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "requests>=2.31.0",
    "sqlalchemy>=2.0",
]

[tool.fastapi]
entrypoint = "equipment_isolation.api.app:app"

[project.scripts]
equipment-isolation = "equipment_isolation.runner:main"
equipment-isolation-agent = "equipment_isolation.agent.cli:main"
equipment-isolation-api = "equipment_isolation.api.__main__:main"
equipment-isolation-eval = "equipment_isolation.evaluation:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]

[tool.setuptools]
py-modules = [
    "agent",
    "api",
    "eval_compare",
    "run",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["equipment_isolation*"]
namespaces = false

[tool.setuptools.package-data]
"equipment_isolation.agent.docs" = ["*.md"]
"equipment_isolation.api.migrations" = ["alembic.ini", "script.py.mako"]
"equipment_isolation.domain" = ["instrument_catalog.json"]
